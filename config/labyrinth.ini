[base]
env_name = labyrinth

[vec]
num_envs = 8

[env]
num_envs = 4096
seed = 0
max_steps = 2000
physics_substeps = 4
# Adaptive curriculum. difficulty_start is the initial difficulty in [0, 1]
# (0 = 3×4 walls-only, 1 = 6×7 half hole-barriers). curriculum_window is the
# sliding-window size for solve-rate tracking: 0 = no curriculum, >0 = advance
# difficulty by CURR_STEP whenever >= CURR_THRESHOLD fraction of recent
# episodes are solved.
difficulty_start = 0.0
curriculum_window = 20

[policy]
hidden_size = 128

[train]
total_timesteps = 20_000_000
horizon = 128
ent_coef = 0.001
learning_rate = 0.001
anneal_lr = 0
