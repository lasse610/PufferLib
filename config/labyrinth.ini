[base]
env_name = labyrinth

[vec]
num_envs = 8

[env]
num_envs = 4096
seed = 0
max_steps = 2000
physics_substeps = 4
# Curriculum. difficulty_start is the starting difficulty in [0, 1]:
#   0.0 = 3×4 maze with no holes at all (just walls)
#   1.0 = 6×7 maze with half hole-barriers (current default)
# curriculum_episodes: 0 = no ramping (stay at difficulty_start), >0 =
# each env linearly ramps from difficulty_start to 1.0 over that many of
# its own completed episodes.
difficulty_start = 1.0
curriculum_episodes = 0

[policy]
hidden_size = 128

[train]
total_timesteps = 20_000_000
horizon = 128
