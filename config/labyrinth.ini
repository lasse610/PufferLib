[base]
env_name = labyrinth

[vec]
num_envs = 8

[env]
num_envs = 4096
seed = 0
max_steps = 2000
physics_substeps = 4
# Adaptive curriculum. difficulty_start is the initial difficulty in [0, 1]
# (0 = 4×5 walls-only, 1 = 4×5 half hole-barriers). curriculum_window is the
# sliding-window size for solve-rate tracking: 0 = no curriculum, >0 = advance
# difficulty by CURR_STEP whenever >= CURR_THRESHOLD fraction of recent
# episodes are solved.
difficulty_start = 0.4
curriculum_window = 20

# Maze env's policy shape — egocentric raster obs wants a fat net.
[policy]
hidden_size = 512
num_layers = 6
expansion_factor = 1

# Matches maze's training recipe: long horizon, heavy value-function weight,
# near-zero entropy bonus, annealed lr, high vtrace clips.
[train]
total_timesteps = 500_000_000
horizon = 256
ent_coef = 1e-5
learning_rate = 0.00076
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.994
gae_lambda = 0.942
vf_coef = 3.0
vf_clip_coef = 3.48
max_grad_norm = 1.41
vtrace_rho_clip = 5.0
clip_coef = 0.13
minibatch_size = 16384
